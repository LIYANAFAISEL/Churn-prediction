version: '3.8'

services:
  # FastAPI backend
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    container_name: churn-api
    restart: unless-stopped

  # Angular frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    container_name: churn-frontend
    restart: unless-stopped
    depends_on:
      - api  # start API first